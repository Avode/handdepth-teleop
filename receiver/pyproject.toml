[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "handdepth-receiver"
version = "0.4.1"
description = "Local TrueDepth body and hand receiver, visualization, recording and replay"
requires-python = ">=3.10,<3.15"
dependencies = ["numpy==2.2.6", "websockets==15.0.1", "opencv-python==4.12.0.88"]
[project.scripts]
handdepth = "handdepth.cli:main"
[tool.setuptools.packages.find]
where = ["."]
[project.optional-dependencies]
teleop = ["mujoco==3.13.0", "mink==1.1.0", "daqp==0.10.3", "qpsolvers==4.13.0", "scipy==1.15.3", "glfw==2.10.0", "PyOpenGL==3.1.10"]
