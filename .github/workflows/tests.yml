name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  receiver:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r receiver/requirements-dev.txt -r receiver/requirements-teleop.txt -e receiver
      - run: python -m pytest -q tests
      # Real G2 physics tests skip unless HANDDEPTH_G2_SCENE points to separately installed assets.
